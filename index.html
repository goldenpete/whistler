<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whistler</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
</head>

<body>
    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <i class="ph-fill ph-wave-sine logo-icon"></i>
                <span class="brand-name">Whistler</span>
            </div>

            <!-- Project Dropdown -->
            <div id="project-switcher" class="project-switcher">
                <label class="context-label">PROJECT</label>
                <div class="custom-select" id="project-dropdown">
                    <div class="custom-select-trigger" id="project-trigger">
                        <span id="project-trigger-text">Select Project</span>
                        <i class="ph-bold ph-caret-down"></i>
                    </div>
                    <div class="custom-select-menu hidden" id="project-menu">
                        <!-- Items populated by JS -->
                    </div>
                </div>
            </div>

            <nav class="nav-menu">
                <div id="project-nav-items">
                    <button class="nav-item active" id="nav-storage">
                        <i class="ph-bold ph-hard-drives"></i>
                        <span>Storage</span>
                    </button>

                    <div class="nav-divider"></div>

                    <div class="nav-section-header">
                        <span>Collections</span>
                        <button class="icon-btn-small" id="btn-add-collection"><i class="ph-bold ph-plus"></i></button>
                    </div>
                    <div id="collections-list" class="collections-list">
                        <!-- Collections injected here -->
                    </div>
                </div>
            </nav>

            <div class="spacer"></div>

            <!-- Sidebar PiP -->
            <div id="pip-container" class="pip-container hidden">
                <div class="pip-video-stage" id="pip-video-stage">
                    <!-- Video moves here -->
                </div>
                <div class="pip-bar">
                    <button class="pip-btn" id="pip-rewind"><i class="ph-bold ph-arrow-counter-clockwise"></i></button>
                    <button class="pip-btn" id="pip-play-pause"><i class="ph-fill ph-play"></i></button>
                    <button class="pip-btn" id="pip-expand"><i class="ph-bold ph-arrows-out"></i></button>
                    <button class="pip-btn" id="pip-close"><i class="ph-bold ph-x"></i></button>
                    <button class="pip-btn" id="pip-forward"><i class="ph-bold ph-arrow-clockwise"></i></button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-view">
            <!-- Storage View (Default) -->
            <section id="view-storage" class="view-section">
                <header class="view-header">
                    <div class="header-breadcrumb">
                        <!-- Breadcrumbs injected by JS -->
                        <div id="breadcrumb-list" class="breadcrumb-list"></div>
                    </div>
                    <div class="header-actions">
                        <!-- Bars (appear to the left) -->
                        <div id="quick-add-bar" class="quick-add-bar hidden">
                            <div class="custom-select" id="source-dropdown" style="width: 130px;">
                                <div class="custom-select-trigger" id="source-trigger">
                                    <span id="source-trigger-text">Catbox</span>
                                    <i class="ph-bold ph-caret-down"></i>
                                </div>
                                <div class="custom-select-menu hidden" id="source-menu">
                                    <div class="custom-select-item" data-value="catbox">Catbox</div>
                                    <div class="custom-select-item" data-value="youtube">YouTube</div>
                                    <div class="custom-select-item" data-value="dropbox">Dropbox</div>
                                    <div class="custom-select-item" data-value="drive">Drive</div>
                                </div>
                            </div>
                            <input type="text" id="input-add-url" class="input-light" placeholder="Paste URL..."
                                style="width: 200px;">
                            <button class="btn-primary" id="btn-add-media">Add</button>
                            <div class="vr"></div>
                            <button class="btn-secondary" id="btn-add-folder" title="New Folder">
                                <i class="ph-bold ph-folder-plus"></i>
                            </button>
                        </div>

                        <div id="search-bar-container" class="search-bar-container hidden">
                            <i class="ph-bold ph-magnifying-glass search-icon-input"></i>
                            <input type="text" id="search-input" placeholder="Search..." autocomplete="off">
                            <!-- Results Dropdown -->
                            <div id="search-results" class="search-results hidden"></div>
                        </div>

                        <!-- Connected Pill Buttons -->
                        <div class="header-action-group">
                            <button id="btn-search-toggle" class="btn-action-segment">
                                <i class="ph-bold ph-magnifying-glass"></i>
                            </button>
                            <div class="action-divider"></div>
                            <button id="btn-expand-add" class="btn-action-segment">
                                <i class="ph-bold ph-plus"></i>
                            </button>
                        </div>
                    </div>
                </header>

                <div class="grid-layout" id="storage-grid">
                    <!-- Media Cards -->
                </div>
            </section>

            <!-- Collection View -->
            <section id="view-collection" class="view-section hidden">
                <header class="view-header">
                    <div class="header-breadcrumb">
                        <h1 id="collection-title">Collection</h1>
                    </div>
                </header>
                <div class="grid-layout" id="collection-items-grid">
                    <!-- Timestamp Cards -->
                </div>
            </section>
        </main>

        <!-- Player Overlay -->
        <div id="player-overlay" class="player-overlay hidden">
            <!-- Top Bar (Spans full width over video and sidebar) -->
            <div class="player-top-bar">
                <div class="player-info">
                    <i class="ph-bold ph-film-strip"></i>
                    <div class="editable-group" id="group-filename" data-tooltip="Edit Title">
                        <span id="player-filename">Filename.mp4</span>
                        <i class="ph-bold ph-pencil-simple edit-icon"></i>
                    </div>
                    <div class="divider-vertical"></div>
                    <div class="editable-group" id="group-description" data-tooltip="Edit Description">
                        <span id="player-description" class="player-description text-truncate">Click to add
                            description</span>
                        <i class="ph-bold ph-pencil-simple edit-icon"></i>
                    </div>
                </div>
                <div class="player-top-actions">
                    <button class="btn-ghost" id="player-link" data-tooltip="Open Link"><i
                            class="ph-bold ph-arrow-square-out"></i></button>
                    <button class="btn-ghost" id="player-btn-copy" data-tooltip="Copy URL"><i
                            class="ph-bold ph-copy"></i></button>
                    <button class="btn-ghost" id="player-btn-share" data-tooltip="Share"><i
                            class="ph-bold ph-share-network"></i></button>
                    <div class="divider-vertical"></div>
                    <button class="btn-ghost" id="player-btn-move" data-tooltip="Move to Folder"><i
                            class="ph-bold ph-folder-notch-plus"></i></button>
                    <button class="btn-ghost" id="player-btn-delete" data-tooltip="Delete File"><i
                            class="ph-bold ph-trash"></i></button>
                    <div class="divider-vertical"></div>
                    <button class="btn-ghost" id="player-btn-close" data-tooltip="Close"><i
                            class="ph-bold ph-x"></i></button>
                </div>
            </div>

            <!-- Player Content -->
            <div class="player-content">
                <div class="player-stage" id="player-stage">
                    <div class="video-wrapper" id="video-wrapper">
                        <!-- Placeholders -->
                        <div id="youtube-placeholder" class="hidden"></div>
                        <video id="main-video" class="main-video"></video>

                        <!-- PDF Container -->
                        <div id="pdf-stage" class="pdf-stage hidden">
                            <div id="pdf-page-container">
                                <canvas id="pdf-render"></canvas>
                                <div id="pdf-text-layer" class="textLayer"></div>
                            </div>
                        </div>

                        <!-- Loader -->
                        <div id="video-loader" class="video-loader hidden">
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                        </div>
                    </div>

                    <!-- Bottom Bar -->
                    <div class="player-bottom-bar">
                        <!-- Speed Menu -->
                        <div id="speed-menu" class="speed-menu hidden">
                            <div class="speed-header">
                                <span id="speed-display">1.00x</span>
                            </div>
                            <div class="speed-slider-row">
                                <button class="btn-icon-small" id="btn-speed-minus"><i
                                        class="ph-bold ph-minus"></i></button>
                                <input type="range" id="speed-slider" class="speed-slider" min="0.25" max="8"
                                    step="0.05" value="1">
                                <button class="btn-icon-small" id="btn-speed-plus"><i
                                        class="ph-bold ph-plus"></i></button>
                            </div>
                            <div class="speed-grid" id="speed-grid">
                                <button class="speed-preset">0.25</button>
                                <button class="speed-preset">0.5</button>
                                <button class="speed-preset">0.75</button>
                                <button class="speed-preset active">1.0</button>
                                <button class="speed-preset">1.25</button>
                                <button class="speed-preset">1.5</button>
                                <button class="speed-preset">1.75</button>
                                <button class="speed-preset">2.0</button>
                                <button class="speed-preset">2.5</button>
                                <button class="speed-preset">3.0</button>
                                <button class="speed-preset">4.0</button>
                                <button class="speed-preset">8.0</button>
                            </div>
                        </div>

                        <div class="seek-container" id="seek-container">
                            <div class="seek-preview" id="seek-preview">
                                <canvas id="seek-preview-canvas" width="160" height="90"></canvas>
                                <span id="seek-preview-time">0:00</span>
                            </div>
                            <div class="seek-track" id="seek-track">
                                <div class="seek-fill" id="seek-fill"></div>
                                <div class="seek-thumb" id="seek-thumb"></div>
                                <div class="seek-markers" id="seek-markers"></div>
                            </div>
                        </div>

                        <div class="controls-row">
                            <div class="controls-left">
                                <button class="ctrl-btn-filled" id="btn-play-pause" data-tooltip="Play/Pause"><i
                                        class="ph-fill ph-play"></i></button>

                                <button class="ctrl-btn-filled" id="btn-volume" data-tooltip="Mute/Unmute"><i
                                        class="ph-bold ph-speaker-high"></i></button>
                                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05"
                                    value="1">
                            </div>

                            <!-- PDF Controls -->
                            <div id="pdf-controls" class="pdf-controls hidden">
                                <button class="ctrl-btn-filled" id="btn-pdf-prev" data-tooltip="Previous Page"><i
                                        class="ph-bold ph-caret-left"></i></button>
                                <span id="pdf-page-num">1 / 10</span>
                                <button class="ctrl-btn-filled" id="btn-pdf-next" data-tooltip="Next Page"><i
                                        class="ph-bold ph-caret-right"></i></button>
                            </div>

                            <span class="time-display" id="time-display">0:00 / 0:00</span>
                        </div>
                        <div class="controls-right">
                            <button class="ctrl-btn-text" id="btn-speed" data-tooltip="Playback Speed">1.00x</button>
                            <button class="ctrl-btn-filled" id="btn-pip-toggle" data-tooltip="Mini Player"><i
                                    class="ph-bold ph-picture-in-picture"></i></button>
                            <button class="ctrl-btn-filled" id="btn-sidebar-toggle" data-tooltip="Toggle Sidebar"><i
                                    class="ph-bold ph-sidebar-simple"></i></button>
                            <button class="ctrl-btn-filled" id="btn-fullscreen" data-tooltip="Fullscreen"><i
                                    class="ph-bold ph-corners-out"></i></button>
                        </div>
                    </div>
                </div>


                <!-- Timestamp Sidebar (Moved inside player-content) -->
                <aside class="player-sidebar" id="player-sidebar">
                    <div class="sidebar-header">
                        <h3>Timestamps</h3>
                        <button class="btn-small-primary" id="btn-add-timestamp">
                            <i class="ph-bold ph-note-pencil"></i> Add
                        </button>
                    </div>
                    <div class="timestamps-scroll" id="timestamps-list">
                        <!-- Timestamps injected -->
                    </div>
                </aside>
            </div> <!-- End player-content -->

        </div> <!-- End player-overlay -->
    </div> <!-- End app -->

    <!-- Modals -->
    <div id="video-desc-tooltip" class="desc-tooltip hidden"></div>
    <div class="modal-backdrop hidden" id="modal-backdrop">
        <!-- New Project Modal -->
        <div class="modal hidden" id="modal-project">
            <h3 class="modal-title">Create Project</h3>
            <div class="form-group">
                <label class="form-label">Project Name</label>
                <input type="text" class="form-input" id="input-project-name" placeholder="e.g., Research Alpha">
            </div>
            <div class="modal-actions">
                <button class="btn-ghost" onclick="app.modals.close()">Cancel</button>
                <button class="btn-primary" id="confirm-project">Create Project</button>
            </div>
        </div>

        <!-- New Collection Modal -->
        <div class="modal hidden" id="modal-collection">
            <h3 class="modal-title">New Collection</h3>
            <div class="form-group">
                <label class="form-label">Collection Name</label>
                <input type="text" class="form-input" id="input-col-name" placeholder="e.g., Highlights">
            </div>
            <div class="form-group">
                <label class="form-label">Color Code</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="input-col-color" value="#6366f1">
                    <span style="font-size: 13px; color: var(--text-secondary);">Pick a color</span>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-ghost" onclick="app.modals.close()">Cancel</button>
                <button class="btn-primary" id="confirm-collection">Create Collection</button>
            </div>
        </div>

        <!-- Confirmation Modal -->
        <div class="modal hidden" id="modal-confirm" style="width: 320px;">
            <h3 class="modal-title" id="confirm-title">Confirm</h3>
            <p id="confirm-message"
                style="color: var(--text-secondary); margin-bottom: 24px; font-size: 14px; line-height: 1.5;">Are you
                sure?</p>
            <div class="modal-actions">
                <button class="btn-ghost" onclick="app.modals.close()">Cancel</button>
                <button class="btn-primary" id="btn-confirm-yes">Delete</button>
            </div>
        </div>

        <!-- Prompt Modal -->
        <div class="modal hidden" id="modal-prompt">
            <h3 class="modal-title" id="prompt-title">Enter Value</h3>
            <div class="form-group">
                <input type="text" class="form-input" id="input-prompt-value">
                <textarea class="form-input modal-textarea hidden" id="input-prompt-textarea"
                    style="height: 120px; resize: none;"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn-ghost" onclick="app.modals.close()">Cancel</button>
                <button class="btn-primary" id="btn-prompt-ok">Save</button>
            </div>
        </div>

        <!-- Timestamp Editor -->
        <div class="modal hidden" id="modal-timestamp">
            <h3 class="modal-title" id="ts-modal-title">Edit Timestamp</h3>

            <div class="form-group">
                <label class="form-label">Collection</label>
                <!-- Custom Dropdown -->
                <div class="custom-dropdown" id="dropdown-ts-collection">
                    <button class="dropdown-trigger" id="trigger-ts-collection">
                        <span>Select Collection</span>
                        <i class="ph-bold ph-caret-down"></i>
                    </button>
                    <div class="dropdown-menu hidden" id="menu-ts-collection"></div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <label class="form-label">Start Time</label>
                    <div class="input-group">
                        <input type="text" id="input-ts-start" class="form-input" placeholder="0:00">
                        <button class="input-group-btn" id="btn-grab-start" data-tooltip="Grab current time"><i
                                class="ph-bold ph-clock"></i></button>
                    </div>
                </div>
                <div class="form-col">
                    <label class="form-label">End Time</label>
                    <div class="input-group">
                        <input type="text" id="input-ts-end" class="form-input" placeholder="0:00">
                        <button class="input-group-btn" id="btn-grab-end" data-tooltip="Grab current time"><i
                                class="ph-bold ph-clock"></i></button>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Note</label>
                <textarea id="input-ts-note" class="form-input modal-textarea" placeholder="Enter note..."></textarea>
            </div>

            <div class="modal-actions" style="justify-content: space-between;">
                <button class="btn-ghost" id="btn-delete-ts" style="color: #ef4444;" data-tooltip="Delete Timestamp"><i
                        class="ph-bold ph-trash"></i></button>
                <div style="display:flex; gap:12px;">
                    <button class="btn-ghost" onclick="app.modals.close()">Cancel</button>
                    <button class="btn-primary" id="confirm-timestamp">Save Timestamp</button>
                </div>
            </div>
        </div>
        <!-- Move File Modal -->
        <div class="modal hidden" id="modal-move-file" style="width: 400px;">
            <h3 class="modal-title">Move to Folder</h3>
            <div id="move-file-list" class="folder-select-list">
                <!-- Javascript will populate this -->
            </div>
            <div class="modal-actions">
                <button class="btn-ghost" onclick="app.modals.close()">Cancel</button>
            </div>
            <!-- PDF Mark Popover -->
            <div id="pdf-popover" class="pdf-popover hidden">
                <button id="btn-add-mark" class="btn-primary-small">
                    <i class="ph-bold ph-bookmark-simple"></i>
                    Add Mark
                </button>
            </div>

        </div>

    </div>

    <script src="whistler.js"></script>
</body>

</html>
