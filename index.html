<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whistler</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>
    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <i class="ph-fill ph-wave-sine logo-icon"></i>
                <span class="brand-name">Whistler</span>
            </div>

            <!-- Context Info (Current Project) -->
            <div id="project-context" class="project-context hidden">
                <span class="context-label">PROJECT</span>
                <span class="context-title" id="sidebar-project-name"></span>
            </div>

            <nav class="nav-menu">
                <button class="nav-item active" id="nav-projects">
                    <i class="ph-bold ph-squares-four"></i>
                    <span>Projects</span>
                </button>
                <div id="project-nav-items" class="hidden">
                    <button class="nav-item" id="nav-storage">
                        <i class="ph-bold ph-hard-drives"></i>
                        <span>Storage</span>
                    </button>

                    <div class="nav-divider"></div>

                    <div class="nav-section-header">
                        <span>Collections</span>
                        <button class="icon-btn-small" id="btn-add-collection"><i class="ph-bold ph-plus"></i></button>
                    </div>
                    <div id="collections-list" class="collections-list">
                        <!-- Collections injected here -->
                    </div>
                </div>
            </nav>

            <div class="spacer"></div>

            <!-- Sidebar PiP -->
            <div id="pip-container" class="pip-container hidden">
                <div class="pip-header">
                    <span>Now Playing</span>
                    <button class="icon-btn-small" id="pip-close"><i class="ph-bold ph-x"></i></button>
                </div>
                <div class="pip-video-stage" id="pip-video-stage">
                    <!-- Video moves here -->
                </div>
                <div class="pip-controls">
                    <button class="pip-ctrl" id="pip-play"><i class="ph-fill ph-play"></i></button>
                    <button class="pip-ctrl" id="pip-expand"><i class="ph-bold ph-corners-out"></i></button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-view">
            <!-- Projects View -->
            <section id="view-projects" class="view-section">
                <header class="view-header">
                    <h1>Projects</h1>
                    <button class="btn-primary" id="btn-new-project">
                        <i class="ph-bold ph-plus"></i> New Project
                    </button>
                </header>
                <div class="grid-layout" id="projects-grid">
                    <!-- Project Cards -->
                </div>
            </section>

            <!-- Storage View -->
            <section id="view-storage" class="view-section hidden">
                <header class="view-header">
                    <div class="header-breadcrumb">
                        <button class="btn-text" id="back-to-projects-start"><i class="ph-bold ph-caret-left"></i>
                            Projects</button>
                        <h1 id="storage-title">Storage</h1>
                    </div>
                    <div class="header-actions">
                        <!-- Input for adding links -->
                        <div class="quick-add-bar">
                            <select id="add-type-select" class="type-select">
                                <option value="catbox">Catbox</option>
                                <option value="youtube">YouTube</option>
                                <option value="dropbox">Dropbox</option>
                                <option value="drive">Drive</option>
                            </select>
                            <input type="text" id="input-add-url" placeholder="Paste URL here..." class="url-input">
                            <button class="btn-primary" id="btn-add-media">Add</button>
                        </div>
                    </div>
                </header>

                <div class="grid-layout" id="storage-grid">
                    <!-- Media Cards -->
                </div>
            </section>

            <!-- Collection View -->
            <section id="view-collection" class="view-section hidden">
                <header class="view-header">
                    <div class="header-breadcrumb">
                        <h1 id="collection-title">Collection</h1>
                    </div>
                </header>
                <div class="grid-layout" id="collection-items-grid">
                    <!-- Timestamp Cards -->
                </div>
            </section>
        </main>

        <!-- Player Overlay -->
        <div id="player-overlay" class="player-overlay hidden">
            <!-- Top Bar (Spans full width over video and sidebar) -->
            <div class="player-top-bar">
                <div class="player-info">
                    <i class="ph-bold ph-film-strip"></i>
                    <span id="player-filename">Filename.mp4</span>
                </div>
                <div class="player-top-actions">
                    <button class="btn-ghost" id="player-btn-edit" title="Edit Name"><i
                            class="ph-bold ph-pencil-simple"></i></button>
                    <button class="btn-ghost" id="player-btn-delete" title="Delete File"><i
                            class="ph-bold ph-trash"></i></button>
                    <div class="divider-vertical"></div>
                    <button class="btn-icon-large" id="player-btn-close" title="Close"><i
                            class="ph-bold ph-x"></i></button>
                </div>
            </div>

            <!-- Player Content -->
            <div class="player-content">
                <div class="player-stage" id="player-stage">
                    <div class="video-wrapper" id="video-wrapper">
                        <!-- Placeholders -->
                        <div id="youtube-placeholder" class="hidden"></div>
                        <video id="main-video" class="main-video"></video>
                        <!-- Loader -->
                        <div id="video-loader" class="video-loader hidden">
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                        </div>
                    </div>

                    <!-- Bottom Bar -->
                    <div class="player-bottom-bar">
                        <div class="seek-container" id="seek-container">
                            <div class="seek-track" id="seek-track">
                                <div class="seek-fill" id="seek-fill"></div>
                                <div class="seek-thumb" id="seek-thumb"></div>
                                <div class="seek-markers" id="seek-markers"></div>
                            </div>
                        </div>

                        <div class="controls-row">
                            <div class="controls-left">
                                <button class="ctrl-btn" id="btn-play-pause"><i class="ph-fill ph-play"></i></button>

                                <div class="volume-container">
                                    <button class="ctrl-btn" id="btn-volume"><i
                                            class="ph-bold ph-speaker-high"></i></button>
                                    <input type="range" id="volume-slider" class="volume-slider" min="0" max="1"
                                        step="0.05" value="1">
                                </div>

                                <span class="time-display" id="time-display">0:00 / 0:00</span>
                            </div>
                            <div class="controls-right">
                                <button class="ctrl-btn-text" id="btn-speed">1x</button>
                                <button class="ctrl-btn-filled" id="btn-pip-toggle" data-tooltip="Mini Player"><i
                                        class="ph-bold ph-picture-in-picture"></i></button>
                                <button class="ctrl-btn-filled" id="btn-sidebar-toggle" data-tooltip="Toggle Sidebar"><i
                                        class="ph-bold ph-sidebar-simple"></i></button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Timestamp Sidebar -->
                <aside class="player-sidebar" id="player-sidebar">
                    <div class="sidebar-header">
                        <h3>Timestamps</h3>
                        <button class="btn-small-primary" id="btn-add-timestamp">
                            <i class="ph-bold ph-note-pencil"></i> Add
                        </button>
                    </div>
                    <div class="timestamps-scroll" id="timestamps-list">
                        <!-- Timestamps injected -->
                    </div>
                </aside>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal-backdrop hidden" id="modal-backdrop">
        <!-- New Project Modal -->
        <div class="modal hidden" id="modal-project">
            <h3 class="modal-title">Create Project</h3>
            <div class="form-group">
                <label class="form-label">Project Name</label>
                <input type="text" class="form-input" id="input-project-name" placeholder="e.g., Research Alpha">
            </div>
            <div class="modal-actions">
                <button class="btn-ghost" onclick="app.modals.close()">Cancel</button>
                <button class="btn-primary" id="confirm-project">Create Project</button>
            </div>
        </div>

        <!-- New Collection Modal -->
        <div class="modal hidden" id="modal-collection">
            <h3 class="modal-title">New Collection</h3>
            <div class="form-group">
                <label class="form-label">Collection Name</label>
                <input type="text" class="form-input" id="input-col-name" placeholder="e.g., Highlights">
            </div>
            <div class="form-group">
                <label class="form-label">Color Code</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="input-col-color" value="#6366f1">
                    <span style="font-size: 13px; color: var(--text-secondary);">Pick a color</span>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-ghost" onclick="app.modals.close()">Cancel</button>
                <button class="btn-primary" id="confirm-collection">Create Collection</button>
            </div>
        </div>

        <!-- Confirmation Modal -->
        <div class="modal hidden" id="modal-confirm" style="width: 320px;">
            <h3 class="modal-title" id="confirm-title">Confirm</h3>
            <p id="confirm-message"
                style="color: var(--text-secondary); margin-bottom: 24px; font-size: 14px; line-height: 1.5;">Are you
                sure?</p>
            <div class="modal-actions">
                <button class="btn-ghost" onclick="app.modals.close()">Cancel</button>
                <button class="btn-primary" style="background: #ef4444; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);"
                    id="btn-confirm-yes">Delete</button>
            </div>
        </div>

        <!-- Prompt Modal -->
        <div class="modal hidden" id="modal-prompt" style="width: 320px;">
            <h3 class="modal-title" id="prompt-title">Enter Value</h3>
            <div class="form-group">
                <input type="text" id="input-prompt-value" class="form-input" style="width: 100%;">
            </div>
            <div class="modal-actions">
                <button class="btn-ghost" onclick="app.modals.close()">Cancel</button>
                <button class="btn-primary" id="btn-prompt-ok">Save</button>
            </div>
        </div>

        <!-- Timestamp Editor -->
        <div class="modal hidden" id="modal-timestamp">
            <h3 class="modal-title" id="ts-modal-title">Edit Timestamp</h3>

            <div class="form-group">
                <label class="form-label">Collection</label>
                <!-- Custom Dropdown -->
                <div class="custom-dropdown" id="dropdown-ts-collection">
                    <button class="dropdown-trigger" id="trigger-ts-collection">
                        <span>Select Collection</span>
                        <i class="ph-bold ph-caret-down"></i>
                    </button>
                    <div class="dropdown-menu hidden" id="menu-ts-collection"></div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <label class="form-label">Start Time</label>
                    <div class="input-group">
                        <input type="text" id="input-ts-start" class="form-input" placeholder="0:00">
                        <button class="input-group-btn" id="btn-grab-start" data-tooltip="Grab current time"><i
                                class="ph-bold ph-clock"></i></button>
                    </div>
                </div>
                <div class="form-col">
                    <label class="form-label">End Time</label>
                    <div class="input-group">
                        <input type="text" id="input-ts-end" class="form-input" placeholder="0:00">
                        <button class="input-group-btn" id="btn-grab-end" data-tooltip="Grab current time"><i
                                class="ph-bold ph-clock"></i></button>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Note</label>
                <textarea id="input-ts-note" class="form-input modal-textarea" placeholder="Enter note..."></textarea>
            </div>

            <div class="modal-actions" style="justify-content: space-between;">
                <button class="btn-ghost" id="btn-delete-ts" style="color: #ef4444;" data-tooltip="Delete Timestamp"><i
                        class="ph-bold ph-trash"></i></button>
                <div style="display:flex; gap:12px;">
                    <button class="btn-ghost" onclick="app.modals.close()">Cancel</button>
                    <button class="btn-primary" id="confirm-timestamp">Save Timestamp</button>
                </div>
            </div>
        </div>
    </div>

    <script src="whistler.js"></script>
</body>

</html>
