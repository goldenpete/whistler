name = "whistler-sync"
main = "src/index.js"
compatibility_date = "2024-01-01"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "whistler-sync-db"
database_id = "fc1b5077-44f4-49b8-a48a-c75aae166b72"

[vars]
# Token expiry in seconds (24 hours)
TOKEN_EXPIRY = "86400"

# SECRETS (set via `wrangler secret put` - DO NOT commit to repo):
# - JWT_SECRET
# - TURNSTILE_SECRET
